name: Import Token Vendor source

on:
  push:
    paths:
      - token-vendor-source.tar.gz

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source and clean temporary files
        run: |
          tar -xzf token-vendor-source.tar.gz
          rm token-vendor-source.tar.gz
          rm .github/workflows/import-source.yml
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete token vendor challenge"
          git push
