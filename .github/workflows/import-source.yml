name: Import Token Vendor source

on:
  push:
    paths:
      - source-import.ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and expand source
        run: |
          cat token-vendor-source.b64.part-* > token-vendor-source.b64.txt
          base64 -d token-vendor-source.b64.txt > token-vendor-source.zip
          unzip -q token-vendor-source.zip
          rm token-vendor-source.b64.part-* token-vendor-source.b64.txt token-vendor-source.zip source-import.ready
          rm .github/workflows/import-source.yml
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete token vendor challenge"
          git push
