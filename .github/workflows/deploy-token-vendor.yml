name: Deploy Token Vendor to Sepolia
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build completed challenge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          corepack enable
          npx --yes create-eth@2.0.23 generated --skip-install --solidity-framework hardhat --extension challenge-token-vendor
          rm -rf generated/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name generated -exec rm -rf {} +
          cp -a generated/. .
          rm -rf generated
          printf '%s' '' | base64 -d | gzip -d | git apply --binary
      - name: Install dependencies
        run: corepack yarn install
      - name: Deploy contracts
        env:
          __RUNTIME_DEPLOYER_PRIVATE_KEY: ${{ secrets.SEPOLIA_DEPLOYER_PRIVATE_KEY }}
        run: |
          corepack yarn workspace @se-2/hardhat hardhat compile
          corepack yarn workspace @se-2/hardhat hardhat deploy --no-compile --skip-prompts --network sepolia
      - name: Publish completed repository
        run: |
          git add -A
          git commit -m "feat: complete and deploy token vendor"
          git push
