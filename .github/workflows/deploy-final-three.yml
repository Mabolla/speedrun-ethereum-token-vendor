name: Test and deploy final three challenges to Sepolia

on:
  workflow_dispatch:
  push:
    branches: [agent/challenge-final-three]
    paths:
      - .github/workflows/deploy-final-three.yml
      - packages/hardhat/contracts/PredictionMarket.sol
      - packages/hardhat/contracts/PredictionMarketToken.sol
      - packages/hardhat/contracts/Voting.sol
      - packages/hardhat/contracts/Verifier.sol
      - packages/hardhat/contracts/WrappedETH.sol
      - packages/hardhat/contracts/mocks/**
      - packages/hardhat/deploy/06_deploy_prediction_markets.ts
      - packages/hardhat/deploy/07_deploy_zk_voting.ts
      - packages/hardhat/deploy/08_deploy_wrapped_eth.ts
      - packages/hardhat/test/PredictionMarket.ts
      - packages/hardhat/test/Voting*.ts
      - packages/hardhat/test/WrappedETH.ts
      - packages/hardhat/test/fixtures/**
      - packages/hardhat/hardhat.config.ts
      - packages/hardhat/package.json
      - packages/hardhat/scripts/checkOracleVerification.ts
      - yarn.lock

permissions:
  contents: write

concurrency:
  group: speedrun-final-three-sepolia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @se-2/hardhat
      - name: Run grading tests and real ZK proof integration
        env:
          STABLECOIN_ETH_USD_PRICE: "3000"
        run: yarn workspace @se-2/hardhat hardhat test test/PredictionMarket.ts test/Voting.ts test/Voting.proof.ts test/WrappedETH.ts test/DEX.ts test/DEX.boundaries.ts test/MyUSDEngine.ts --network hardhat
      - name: Deploy the three challenge tags in order
        env:
          __RUNTIME_DEPLOYER_PRIVATE_KEY: ${{ secrets.SEPOLIA_DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$__RUNTIME_DEPLOYER_PRIVATE_KEY" ]; then
            echo "Existing Sepolia deployer secret is unavailable."
            exit 1
          fi
          yarn workspace @se-2/hardhat hardhat deploy --no-compile --skip-prompts --network sepolia --tags PredictionMarkets
          yarn workspace @se-2/hardhat hardhat deploy --no-compile --skip-prompts --network sepolia --tags ZKVoting
          yarn workspace @se-2/hardhat hardhat deploy --no-compile --skip-prompts --network sepolia --tags WrappedETH
      - name: Save deployment addresses and frontend ABIs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/hardhat/deployments/sepolia packages/nextjs/contracts/deployedContracts.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: save final three Sepolia deployments"
            git push
          fi
      - name: Verify Sepolia source on Etherscan
        run: yarn hardhat:verify --network sepolia --min-interval 1500
      - name: Confirm verified names, ABIs and canonical grader source paths
        run: yarn workspace @se-2/hardhat node --import tsx scripts/checkOracleVerification.ts PredictionMarket PredictionMarketTokenYes PredictionMarketTokenNo PoseidonT3 LeanIMT HonkVerifier Voting WrappedETH
