name: Build Token Vendor repository

on:
  push:
    paths:
      - .github/workflows/bootstrap-token-vendor.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate official challenge base
        run: |
          corepack enable
          npx --yes create-eth@2.0.23 generated --skip-install --solidity-framework hardhat --extension challenge-token-vendor
      - name: Replace temporary repository and apply completed solution
        run: |
          rm -rf generated/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name generated -exec rm -rf {} +
          cp -a generated/. .
          rm -rf generated
          printf '%s' '' | base64 -d | gzip -d | git apply --binary
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete token vendor challenge"
          git push
