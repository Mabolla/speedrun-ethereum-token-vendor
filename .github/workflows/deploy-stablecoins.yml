name: Test and deploy Stablecoins to Sepolia

on:
  workflow_dispatch:
  push:
    branches: [agent/challenge-stablecoins]
    paths:
      - .github/workflows/deploy-stablecoins.yml
      - packages/hardhat/contracts/stablecoins/**
      - packages/hardhat/deploy/05_deploy_stablecoins.ts
      - packages/hardhat/test/MyUSDEngine.ts
      - packages/hardhat/scripts/fetchPriceFromUniswap.ts

permissions:
  contents: write

concurrency:
  group: speedrun-stablecoins-sepolia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @se-2/hardhat
      - name: Run official Stablecoin grading tests
        env:
          STABLECOIN_ETH_USD_PRICE: "2600"
        run: yarn workspace @se-2/hardhat hardhat test test/MyUSDEngine.ts --network hardhat
      - name: Deploy only Stablecoin contracts to Sepolia
        env:
          __RUNTIME_DEPLOYER_PRIVATE_KEY: ${{ secrets.SEPOLIA_DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$__RUNTIME_DEPLOYER_PRIVATE_KEY" ]; then
            echo "Existing Sepolia deployer secret is unavailable."
            exit 1
          fi
          yarn workspace @se-2/hardhat hardhat deploy --no-compile --skip-prompts --network sepolia --tags Stablecoins
      - name: Save deployment addresses and frontend ABIs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/hardhat/deployments/sepolia packages/nextjs/contracts/deployedContracts.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: save Stablecoins Sepolia deployment"
            git push
          fi
      - name: Verify Sepolia source on Etherscan
        run: yarn hardhat:verify --network sepolia --min-interval 1500
      - name: Confirm Stablecoin sources and ABIs are verified
        run: yarn workspace @se-2/hardhat node --import tsx scripts/checkOracleVerification.ts RateController MyUSD StableDEX Oracle MyUSDStaking MyUSDEngine
