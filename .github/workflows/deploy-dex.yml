name: Test and deploy DEX to Sepolia

on:
  push:
    branches: [agent/challenge-dex]
    paths:
      - .github/workflows/deploy-dex.yml
      - packages/hardhat/contracts/DEX.sol
      - packages/hardhat/contracts/Balloons.sol
      - packages/hardhat/deploy/02_deploy_dex.ts
      - packages/hardhat/test/DEX*.ts

permissions:
  contents: write

concurrency:
  group: speedrun-dex-sepolia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn workspaces focus @se-2/hardhat
      - name: Run official DEX tests and boundary tests
        run: yarn workspace @se-2/hardhat hardhat test test/DEX.ts test/DEX.boundaries.ts --network hardhat
      - name: Deploy only DEX contracts to Sepolia
        env:
          __RUNTIME_DEPLOYER_PRIVATE_KEY: ${{ secrets.SEPOLIA_DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$__RUNTIME_DEPLOYER_PRIVATE_KEY" ]; then
            echo "Existing Sepolia deployer secret is unavailable."
            exit 1
          fi
          yarn workspace @se-2/hardhat hardhat deploy --no-compile --skip-prompts --network sepolia --tags DEX
      - name: Save deployment addresses and frontend ABIs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/hardhat/deployments/sepolia packages/nextjs/contracts/deployedContracts.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: save DEX Sepolia deployment"
            git push
          fi
      - name: Verify Sepolia source on Etherscan
        run: yarn hardhat:verify --network sepolia
